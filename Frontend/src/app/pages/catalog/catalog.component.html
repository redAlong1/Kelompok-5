<div class="d-flex vh-100 overflow-hidden">


  <!-- ===== MAIN CONTENT ===== -->
  <main class="flex-grow-1 d-flex flex-column bg-light overflow-auto">


    <!-- CONTENT AREA -->
    <div class="p-4">

      <!-- SEARCH & SORT -->
      <div class="row g-2 mb-4">
        <div class="col-md-7">
          <div class="input-group shadow-sm">
            <span class="input-group-text bg-white border-end-0">
              <i class="bi bi-search text-muted"></i>
            </span>
            <input
              type="text"
              class="form-control border-start-0 ps-0"
              placeholder="Cari judul, penulis, atau ISBN"
              [(ngModel)]="searchQuery"
              (keyup.enter)="onSearch()"
            >
          </div>
        </div>
        <div class="col-md-3">
          <select class="form-select shadow-sm" [(ngModel)]="selectedSort">
            <option value="newest">Terbaru</option>
            <option value="title">Judul A-Z</option>
          </select>
        </div>
        <div class="col-md-2">
          <button class="btn btn-primary w-100 fw-semibold shadow-sm" (click)="onSearch()">
            <i class="bi bi-search me-1"></i> Cari
          </button>
        </div>
      </div>

      <!-- CATEGORY TABS -->
      <div class="d-flex flex-wrap gap-2 mb-3">
        <button
          *ngFor="let cat of categories"
          class="btn btn-sm category-tab"
          [class.active]="activeCategory === cat.name"
          (click)="setCategory(cat)"
        >
          {{ cat.name }}
        </button>
      </div>

      <!-- RESULT INFO -->
      <div class="d-flex justify-content-between align-items-center mb-3">
        <p class="text-muted small mb-0">Menampilkan <strong>{{ books.length }}</strong> buku</p>
        <button class="btn btn-sm btn-link text-decoration-none text-muted" (click)="loadBooks()" title="Refresh data">
          <i class="bi bi-arrow-clockwise me-1"></i> Refresh
        </button>
      </div>

      <!-- ERROR MESSAGE -->
      <div *ngIf="errorMessage" class="alert alert-warning alert-dismissible fade show mb-3 py-2 small" role="alert">
        <i class="bi bi-exclamation-circle me-1"></i> {{ errorMessage }}
        <button type="button" class="btn-close btn-sm" (click)="errorMessage = ''"></button>
      </div>

      <!-- LOADING STATE -->
      <div *ngIf="loading" class="text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="text-muted mt-2 small">Memuat koleksi buku dari perpustakaan...</p>
      </div>

      <!-- BOOK GRID -->
      <div class="row g-4" *ngIf="!loading">
        <div class="col-12 col-sm-6 col-md-4 col-lg-3" *ngFor="let book of books">
          <div class="card book-card border-0 shadow-sm h-100" (click)="goToDetail(book.bookId)" style="cursor:pointer;">

            <!-- Book Cover -->
            <div class="book-cover {{ book.coverColor }} d-flex align-items-end p-3 position-relative">
              <img
                *ngIf="book.coverUrl"
                class="book-cover-image"
                [src]="getCoverImageUrl(book.coverUrl)"
                [alt]="'Cover ' + book.title"
                (error)="book.coverUrl = undefined"
              >
              <div class="book-cover-overlay"></div>
              <div class="position-relative z-1 w-100">
                <div class="fw-bold text-white fs-6 book-title-cover">{{ book.title }}</div>
                <div class="text-white-50 small mt-1 text-truncate">{{ book.authorName }}</div>
              </div>
            </div>

            <!-- Card Body -->
            <div class="card-body d-flex flex-column p-3">
              <h6 class="card-title fw-bold mb-1 text-dark text-truncate" title="{{ book.title }}">{{ book.title }}</h6>
              <p class="text-muted small mb-2 text-truncate">{{ book.authorName }}</p>

              <!-- Rating & Stock -->
              <div class="d-flex align-items-center justify-content-between mb-3">
                <!-- Stock -->
              <div>
                <span *ngIf="!book.isBorrowed" class="badge stock-badge">
                  Stok {{ book.stock }}
                </span>
                <span *ngIf="book.isBorrowed" class="badge bg-danger">
                  Dipinjam semua
                </span>
              </div>
              </div>

              <!-- Action Button -->
              <button
                *ngIf="!book.isBorrowed"
                class="btn btn-primary btn-sm w-100 mt-auto fw-semibold"
                (click)="pinjamBuku($event, book)"
              >
                Pinjam
              </button>
              <button
                *ngIf="book.isBorrowed"
                class="btn btn-outline-secondary btn-sm w-100 mt-auto fw-semibold"
                (click)="pinjamBuku($event, book)"
              >
                Reservasi
              </button>
            </div>

          </div>
        </div>
      </div>

      <!-- Empty State -->
      <div *ngIf="!loading && books.length === 0" class="text-center py-5">
        <i class="bi bi-search fs-1 text-muted"></i>
        <p class="text-muted mt-3">Tidak ada buku yang ditemukan.</p>
      </div>

    </div>
  </main>

</div>
