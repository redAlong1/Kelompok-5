<div class="d-flex vh-100 overflow-hidden">
  
  <!-- SIDEBAR (Menggunakan Bootstrap Flexbox & Background) -->
  <aside class="d-flex flex-column flex-shrink-0 p-3 text-white bg-dark" style="width: 250px;">
    <a href="/" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decoration-none">
      <i class="bi bi-book-half me-2 fs-4"></i>
      <span class="fs-5 fw-bold">LibraryPlus</span>
    </a>
    <hr>
    <ul class="nav nav-pills flex-column mb-auto">
      <li class="nav-item mb-1">
        <a routerLink="/catalog" class="nav-link active text-white" aria-current="page">
          <i class="bi bi-grid me-2"></i> Katalog & Pinjam
        </a>
      </li>
      <li class="nav-item mb-1">
        <a href="#" class="nav-link text-white-50">
          <i class="bi bi-calendar-check me-2"></i> Reservasi
        </a>
      </li>
      <li class="nav-item mb-1">
        <a href="#" class="nav-link text-white-50">
          <i class="bi bi-clock-history me-2"></i> Riwayat Peminjaman
        </a>
      </li>
      <li class="nav-item mb-1">
        <a href="#" class="nav-link text-white-50">
          <i class="bi bi-exclamation-circle me-2"></i> Denda Saya
        </a>
      </li>
      <li class="nav-item mb-1">
        <a href="#" class="nav-link text-white-50">
          <i class="bi bi-person me-2"></i> Profil & Membership
        </a>
      </li>
    </ul>
    <hr>
    <a routerLink="/login" class="nav-link text-danger">
      <i class="bi bi-box-arrow-left me-2"></i> Logout
    </a>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="flex-grow-1 d-flex flex-column bg-light overflow-auto">
    
    <!-- TOP HEADER -->
    <header class="d-flex justify-content-between align-items-center bg-white px-4 py-3 border-bottom shadow-sm">
      <h2 class="fs-5 fw-bold text-dark m-0">Katalog & Pinjam (Member)</h2>
      <div class="d-flex align-items-center gap-2">
        <img src="https://ui-avatars.com/api/?name=Andi&background=random" alt="User" class="rounded-circle" width="32" height="32">
        <span class="fw-semibold text-dark">Andi</span>
      </div>
    </header>

    <!-- CONTENT AREA -->
    <div class="p-4">
      <h1 class="fs-3 fw-bold text-dark mb-4">Katalog Buku</h1>

      <!-- SEARCH & FILTER (Bootstrap Grid & Forms) -->
      <div class="row g-3 mb-4">
        <div class="col-md-6">
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
            <input type="text" class="form-control border-start-0" placeholder="Cari buku...">
          </div>
        </div>
        <div class="col-md-4">
          <select class="form-select">
            <option selected>Semua Kategori</option>
            <option>Programming</option>
            <option>Novel</option>
            <option>Self Improvement</option>
          </select>
        </div>
        <div class="col-md-2">
          <button class="btn btn-primary w-100 fw-bold">Cari</button>
        </div>
      </div>

      <!-- BOOK GRID (Bootstrap Grid) -->
      <div class="row g-4">
        <div class="col-12 col-sm-6 col-md-4 col-lg-3" *ngFor="let book of books">
          
          <!-- Card Buku -->
          <div class="card h-100 border-0 shadow-sm" style="cursor: pointer;" (click)="goToDetail(book.bookId)">
            
            <!-- Cover Placeholder (Bisa diganti tag <img> nanti) -->
            <div class="bg-secondary bg-opacity-25 d-flex align-items-center justify-content-center rounded-top" style="height: 250px;">
              <span class="text-muted fw-bold text-center px-2">{{ book.title }}</span>
            </div>

            <div class="card-body d-flex flex-column">
              <span class="badge bg-primary bg-opacity-10 text-primary mb-2 align-self-start">{{ book.categoryName }}</span>
              <h5 class="card-title fw-bold text-truncate" title="{{ book.title }}">{{ book.title }}</h5>
              <p class="card-text text-muted small mb-3">{{ book.authorName }}</p>
              
              <button class="btn btn-primary w-100 mt-auto fw-bold" (click)="pinjamBuku($event, book.title)">
                <i class="bi bi-box-arrow-in-down me-1"></i> Pinjam
              </button>
            </div>
          </div>

        </div>
      </div>

    </div>
  </main>
</div>
