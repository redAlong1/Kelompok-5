<aside class="sidebar d-flex flex-column flex-shrink-0 text-white" style="width: 240px; min-height: 100vh;">

  <!-- Logo -->
  <div class="sidebar-logo d-flex align-items-center px-4 py-3">
    <div class="logo-icon me-2">
      <i class="bi bi-book-fill"></i>
    </div>
    <div>
      <div class="fw-bold fs-6 lh-1">LibraryPlus</div>
      <div class="sidebar-subtitle opacity-75">Member Area</div>
    </div>
  </div>

  <!-- Nav Menu -->
  <nav class="flex-grow-1 px-3 mt-2">
    <ul class="nav flex-column gap-1">

      <li class="nav-item">
        <a routerLink="/dashboard"
           routerLinkActive="active"
           class="nav-link sidebar-link rounded">
          <i class="bi bi-grid-1x2 me-2"></i> Dashboard
        </a>
      </li>

      <li class="nav-item">
        <a routerLink="/catalog"
           routerLinkActive="active"
           class="nav-link sidebar-link rounded">
          <i class="bi bi-journals me-2"></i> Katalog &amp; Pinjam
        </a>
      </li>

      <li class="nav-item">
        <a routerLink="/reservations"
           routerLinkActive="active"
           class="nav-link sidebar-link rounded">
        <a routerLink="/publisher"
           routerLinkActive="active"
           class="nav-link sidebar-link rounded">
          <i class="bi bi-building me-2"></i> Publisher
        </a>
      </li>

      <li class="nav-item">
        <a routerLink="/author"
           routerLinkActive="active"
           class="nav-link sidebar-link rounded">
          <i class="bi bi-person-lines-fill me-2"></i> Author
        </a>
      </li>

      <li class="nav-item">
        <a routerLink="/category"
           routerLinkActive="active"
           class="nav-link sidebar-link rounded">
          <i class="bi bi-tags me-2"></i> Kategori
        </a>
      </li>

      <li class="nav-item">
        <a routerLink="/books-master"
           routerLinkActive="active"
           class="nav-link sidebar-link rounded">
          <i class="bi bi-book me-2"></i> Master Buku
        </a>
      </li>

      <li class="nav-item">
        <a routerLink="/inventory"
           routerLinkActive="active"
           class="nav-link sidebar-link rounded">
          <i class="bi bi-box-seam me-2"></i> Inventory &amp; Stok
        </a>
      </li>

      <li class="nav-item">
        <a href="#" class="nav-link sidebar-link text-white-50 rounded">
          <i class="bi bi-calendar-check me-2"></i> Reservasi
        </a>
      </li>

      <li class="nav-item">
        <a href="#" class="nav-link sidebar-link text-white-50 rounded">
          <i class="bi bi-clock-history me-2"></i> Riwayat Peminjaman
        </a>
      </li>

      <li class="nav-item">
        <a href="#" class="nav-link sidebar-link text-white-50 rounded">
          <i class="bi bi-exclamation-circle me-2"></i> Denda Saya
        </a>
      </li>

      <li class="nav-item">
        <a href="#" class="nav-link sidebar-link text-white-50 rounded">
          <i class="bi bi-person me-2"></i> Profil &amp; Membership
        </a>
      </li>
            <li class="nav-item" *ngIf="authService.isAdmin()">
        <a routerLink="/admin/return"
           routerLinkActive="active"
           class="nav-link sidebar-link rounded">
          <i class="bi bi-box-arrow-in-left me-2"></i> Pengembalian (Admin)
        </a>
      </li>

    </ul>
  </nav>

  <!-- Membership Info -->
  <div class="membership-box mx-3 mb-2 p-3 rounded">
    <div class="small text-white-50 mb-1">Membership</div>
    <div class="fw-bold text-warning mb-1">Silver</div>
    <div class="small text-white-50">Maks. 5 buku · 14 hari</div>
  </div>

  <!-- Logout Button -->
  <div class="px-3 pb-3">
    <button (click)="logout()" class="btn btn-link nav-link sidebar-link text-white-50 rounded w-100 text-start text-decoration-none border-0 p-2">
      <i class="bi bi-box-arrow-right me-2"></i> Logout
    </button>
  </div>

</aside>
