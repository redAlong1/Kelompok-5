<aside class="sidebar" [class.collapsed]="collapsed">

  <!-- Logo -->
  <div class="sidebar-logo">
    <div class="logo-icon">
      <i class="bi bi-book-fill"></i>
    </div>
    <div class="logo-text">
      <div class="logo-title">AdIns Library</div>
      <div class="logo-subtitle">{{ authService.isAdmin() ? 'Admin Area' : 'Member Area' }}</div>
    </div>
  </div>

  <!-- Menu (scroll sendiri) -->
  <nav class="sidebar-nav">

    <div class="nav-section">Menu Utama</div>

    <a routerLink="/dashboard" routerLinkActive="active" class="sidebar-link" title="Dashboard">
      <i class="bi bi-grid-1x2"></i><span>Dashboard</span>
    </a>
    <a routerLink="/catalog" routerLinkActive="active" class="sidebar-link" title="Katalog & Pinjam">
      <i class="bi bi-journals"></i><span>Katalog &amp; Pinjam</span>
    </a>
    <a routerLink="/reservations" routerLinkActive="active" class="sidebar-link" title="Reservasi">
      <i class="bi bi-calendar-check"></i><span>Reservasi</span>
    </a>
    <a href="#" class="sidebar-link disabled" title="Riwayat Peminjaman">
      <i class="bi bi-clock-history"></i><span>Riwayat Peminjaman</span>
    </a>
    <a href="#" class="sidebar-link disabled" title="Denda Saya">
      <i class="bi bi-exclamation-circle"></i><span>Denda Saya</span>
    </a>

    <ng-container *ngIf="authService.isAdmin()">
      <div class="nav-section">Kelola Perpustakaan</div>

      <a routerLink="/books-master" routerLinkActive="active" class="sidebar-link" title="Master Buku">
        <i class="bi bi-book"></i><span>Master Buku</span>
      </a>
      <a routerLink="/inventory" routerLinkActive="active" class="sidebar-link" title="Inventory & Stok">
        <i class="bi bi-box-seam"></i><span>Inventory &amp; Stok</span>
      </a>
      <a routerLink="/author" routerLinkActive="active" class="sidebar-link" title="Author">
        <i class="bi bi-person-lines-fill"></i><span>Author</span>
      </a>
      <a routerLink="/publisher" routerLinkActive="active" class="sidebar-link" title="Publisher">
        <i class="bi bi-building"></i><span>Publisher</span>
      </a>
      <a routerLink="/category" routerLinkActive="active" class="sidebar-link" title="Kategori">
        <i class="bi bi-tags"></i><span>Kategori</span>
      </a>
      <a routerLink="/admin/return" routerLinkActive="active" class="sidebar-link" title="Pengembalian">
        <i class="bi bi-box-arrow-in-left"></i><span>Pengembalian</span>
      </a>
    </ng-container>

  </nav>

  <!-- Tombol collapse -->
  <button type="button" class="collapse-btn" (click)="toggle()"
          [title]="collapsed ? 'Perbesar menu' : 'Kecilkan menu'">
    <i class="bi" [ngClass]="collapsed ? 'bi-chevron-double-right' : 'bi-chevron-double-left'"></i>
    <span>Kecilkan menu</span>
  </button>

</aside>
